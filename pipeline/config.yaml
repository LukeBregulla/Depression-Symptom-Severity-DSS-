# Test/Holdout Evaluation Configuration
# =====================================
# Modify these settings before running: python pipeline/Test.py
# All paths are relative to the DSS project root

test_data:
  file: "data/test.csv"
  sep: "\t" 
  encoding: "utf-8"

output:
  directory: "results/test"
  name: "test"

evaluation:
  classes: 3  # number of classes: 3 = [0,1,2] (none/moderate/severe); 2 = [1,2] (moderate/severe); 1 = [0] (single class)

